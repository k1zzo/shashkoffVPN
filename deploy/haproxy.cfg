#---------------------------------------------------------------------
# /etc/haproxy/haproxy.cfg
#
# Архитектура:
#   :443 TCP frontend, два уровня роутинга:
#     1) если ALPN == acme-tls/1   → Caddy (это ACME challenge)
#     2) иначе по SNI:
#          - shkoff-cloud.com (+ поддомены) → Caddy :9443
#          - default (SNI=apple и др.)      → Xray Reality :8444
#
#   :8443 mtg (MTProto) — отдельно, HAProxy не трогает.
#
# Порт 80 НЕ используется (закрыт фаерволом). Обновление сертификата —
# через TLS-ALPN-01: Let's Encrypt подключается на :443 с
# ALPN=acme-tls/1, HAProxy роутит этот коннект в Caddy, Caddy отвечает
# challenge-сертификатом. Всё внутри одного :443.
#---------------------------------------------------------------------

global
    log /dev/log    local0
    log /dev/log    local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    # Долгие VPN-туннели — до 1 часа простоя:
    timeout tunnel  1h
    timeout client-fin 30s

#---------------------------------------------------------------------
# :443 — TCP frontend
#---------------------------------------------------------------------
frontend tls_in
    # Никакого ssl/alpn в bind — HAProxy здесь не терминирует TLS,
    # он только читает сырой ClientHello.
    bind *:443
    mode tcp
    option tcplog

    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # 1) ACME TLS-ALPN-01: Let's Encrypt подключается с ALPN=acme-tls/1.
    #    Этот коннект ВСЕГДА должен попасть в Caddy (любой SNI),
    #    поэтому проверяем ALPN раньше SNI.
    acl is_acme_alpn req.ssl_alpn acme-tls/1
    use_backend be_caddy_tls if is_acme_alpn

    # 2) Обычный TLS-трафик — роутим по SNI:
    acl is_shkoff     req_ssl_sni -i shkoff-cloud.com
    acl is_shkoff_sub req_ssl_sni -m end -i .shkoff-cloud.com
    use_backend be_caddy_tls if is_shkoff or is_shkoff_sub

    # 3) Всё остальное (SNI=www.apple.com от Reality-клиентов и др.) → Xray
    default_backend be_xray_reality

#---------------------------------------------------------------------
# Backend: Caddy — TLS termination для сайта + ACME challenge
#---------------------------------------------------------------------
backend be_caddy_tls
    mode tcp
    server caddy_tls 127.0.0.1:9443

#---------------------------------------------------------------------
# Backend: Xray Reality — сырой TCP, без PROXY protocol
#---------------------------------------------------------------------
backend be_xray_reality
    mode tcp
    server xray 127.0.0.1:8444
