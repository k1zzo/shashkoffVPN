services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: shashkoffvpn-app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    volumes:
      # SQLite DB + Xray clients fragment share this directory.
      # Host path (when deployed to /opt/shashkoffvpn): /opt/shashkoffvpn/data/
      # App writes xray-clients.json here; the host-side watcher reads it.
      - ../data:/app/data
    restart: unless-stopped
    networks:
      - shashkoff

networks:
  shashkoff:
    name: shashkoff
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-shashkoff
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
