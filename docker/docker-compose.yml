services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: shashkoffvpn-app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    volumes:
      # SQLite DB + Xray clients fragment share this directory.
      # Host path (when deployed to /opt/shashkoffvpn): /opt/shashkoffvpn/data/
      # App writes xray-clients.json here; the host-side watcher reads it.
      - ../data:/app/data
    restart: unless-stopped
