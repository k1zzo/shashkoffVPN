<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHASHKOFFVPN Error</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6fb;
        color: #1f2937;
      }

      .card {
        width: min(440px, 92vw);

        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.25rem;
      }

      p {
        margin: 0;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>{{ message }}</h1>
      <p>Please check your link and try again.</p>
    </main>
  </body>
</html>
