<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b1a">
  <title>SHASHKOFF VPN</title>
  <link rel="stylesheet" href="/static/css/error.css">
</head>

<body>

  <header class="header">
    <div class="brand">
      <img class="brand-logo" src="/static/images/logo.png" alt="SHASHKOFF VPN logo">
      <div class="brand-text">
        <h1 class="brand-title">SHASHKOFF VPN</h1>
        <p class="brand-subtitle">Персональный кабинет подписки</p>
      </div>
    </div>
  </header>

  <div class="error-wrapper">
    <div class="error-card">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
      </div>

      <h2 class="error-title">{{ message }}</h2>

      <p class="error-message">{{ subtitle | default("Проверьте ссылку или обратитесь к администратору.") }}</p>
    </div>
  </div>

</body>

</html>
