<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open VPN Profile</title>
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, sans-serif;
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, rgba(28, 118, 255, 0.15), transparent 40%),
          radial-gradient(circle at 80% 90%, rgba(0, 198, 255, 0.12), transparent 35%),
          #0b1020;
        color: #e5ecff;
      }

      .panel {
        width: min(640px, 94vw);
        background: rgba(16, 24, 42, 0.92);
        border: 1px solid rgba(110, 144, 255, 0.2);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 16px 40px rgba(2, 8, 24, 0.55);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      .subtitle {
        margin: 0 0 18px;
        color: #9fb0d9;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .stat {
        background: rgba(25, 38, 66, 0.85);
        border: 1px solid rgba(118, 145, 221, 0.22);
        border-radius: 10px;
        padding: 10px 12px;
      }

      .label {
        display: block;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        color: #8ea2d3;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .value {
        font-weight: 600;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
      }

      .btn-primary {
        background: linear-gradient(135deg, #1f7aec, #1cb8e6);
        color: #fff;
      }

      .btn-secondary {
        background: rgba(44, 60, 97, 0.8);
        color: #dbe7ff;
        border: 1px solid rgba(125, 150, 223, 0.28);
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Preparing your VPN profile</h1>
      <p class="subtitle">
        Your profile is ready. Use the button below to open or download it.
      </p>

      <section class="stats">
        <div class="stat">
          <span class="label">Username</span>
          <span class="value">{{ context.username }}</span>
        </div>
        <div class="stat">
          <span class="label">Device usage</span>
          <span class="value">{{ context.devices_used }}/{{ context.max_devices }}</span>
        </div>
      </section>

      <div class="actions">
        <a class="btn btn-primary" href="{{ open_download_url }}">Open profile</a>
        <a class="btn btn-secondary" href="{{ open_raw_url }}">Raw JSON</a>
      </div>
    </main>
  </body>
</html>
